<!DOCTYPE html>
<html lang="de" translate="no">
<head>
  <meta charset="UTF-8">
  <title>Sitzplan alphabetisch — Old Money Line · Demo</title>
  <link rel="stylesheet" href="/atelier/fonts.css">
  <link rel="stylesheet" href="wsa_panel.css">
  <style>
    /* ── Generator-spezifische Ergänzungen ── */
    .guest-count      { font-size: 9px; color: #bbb; text-align: right; margin-top: 3px; }
    .guest-count.warn { color: #c0392b; font-weight: 500; }
    .panel-form textarea { min-height: 200px; flex: 1; }

    /* ── CLS-Schutz: reserviert vor JS-Scaling den korrekten Platz für das Poster.
       Ohne diese Regeln springt #preview-scaler von ungescalter (~1123px hoch)
       auf gescalte Höhe und löst CLS auf html>body aus. */
    #preview-scaler {
      width: min(100%, 210mm);
      aspect-ratio: 210 / 297;
    }
    #preview-scaler:not(.wsa-ready) { transition: none !important; }
    #preview-scaler:not(.wsa-ready) #poster { visibility: hidden; }

    /* ══ POSTER ══════════════════════════════════ */
    #poster {
      width: 210mm; height: 297mm;
      position: relative; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      display: flex; flex-direction: column;
    }

    /* ── Themes Old Money ── */
    #poster.burgund { background-color: #FEF8F7; color: #8B1A35; border: 14px solid #8B1A35; }
    #poster.cognac  { background-color: #FEF9F5; color: #7B4718; border: 14px solid #7B4718; }
    #poster.forest  { background-color: #F7FAF7; color: #1F4A32; border: 14px solid #1F4A32; }

    /* ── Inner frame ── */
    .poster-frame { position: absolute; inset: 7mm; pointer-events: none; z-index: 1; }
    .burgund .poster-frame { border: 1px solid rgba(139,26,53,0.38); }
    .cognac  .poster-frame { border: 1px solid rgba(123,71,24,0.38); }
    .forest  .poster-frame { border: 1px solid rgba(31,74,50,0.38);  }

    /* ── Body ── */
    .poster-body {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 13mm 14mm 10mm;
      position: relative; z-index: 2;
    }

    /* ── Header ── */
    #poster-header { text-align: center; flex-shrink: 0; margin-bottom: 6mm; }
    .poster-eyebrow {
      font-family: 'DM Sans', sans-serif; font-size: 7pt;
      letter-spacing: 5px; text-transform: uppercase; opacity: 0.42; margin-bottom: 2.5mm;
    }
    .poster-title {
      font-family: 'Cormorant Garamond', serif; font-size: 24pt;
      font-weight: 300; letter-spacing: 6px; text-transform: uppercase; line-height: 1.1;
    }
    .burgund .poster-title { color: #8B1A35; }
    .cognac  .poster-title { color: #7B4718; }
    .forest  .poster-title { color: #1F4A32; }
    .poster-subtitle {
      margin-top: 2mm; font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 10pt; letter-spacing: 1.5px; opacity: 0.62;
    }
    .poster-rule { width: 30mm; height: 1px; margin: 4mm auto 0; }
    .burgund .poster-rule { background: rgba(139,26,53,0.38); }
    .cognac  .poster-rule { background: rgba(123,71,24,0.38); }
    .forest  .poster-rule { background: rgba(31,74,50,0.38);  }

    /* ── Alpha list wrapper ── */
    #alpha-wrapper { flex: 1; min-height: 0; overflow: hidden; }

    /* ── Alpha list (CSS columns) ── */
    #alpha-list {
      column-count: var(--cols, 3);
      column-gap: 7mm;
      column-fill: balance;
    }

    /* ── Buchstabengruppe — nie über Spalten brechen ── */
    .alpha-group {
      break-inside: avoid;
      page-break-inside: avoid;
      text-align: center;
      margin-bottom: var(--group-mb, 4.5mm);
    }

    /* ── Ornament ── */
    .grp-orn { display: block; line-height: 0; margin-bottom: var(--orn-mb, 2mm); }
    .grp-orn svg { display: inline-block; width: 100%; height: auto; max-width: var(--orn-w, 72px); }
    .burgund .grp-orn { color: rgba(139,26,53,0.62); }
    .cognac  .grp-orn { color: rgba(123,71,24,0.62); }
    .forest  .grp-orn { color: rgba(31,74,50,0.62);  }

    /* ── Buchstabe ── */
    .alpha-letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: var(--fs-letter, 13pt);
      font-weight: 400; line-height: 1;
      margin-bottom: var(--letter-mb, 1.2mm);
    }
    .burgund .alpha-letter { color: #8B1A35; }
    .cognac  .alpha-letter { color: #7B4718; }
    .forest  .alpha-letter { color: #1F4A32; }

    /* ── Diamant-Trennlinie ── */
    .alpha-diamond-rule {
      display: flex; align-items: center; gap: 4px;
      margin-bottom: var(--header-mb, 2mm);
    }
    .adr-line { flex: 1; height: 1px; }
    .burgund .adr-line { background: rgba(139,26,53,0.20); }
    .cognac  .adr-line { background: rgba(123,71,24,0.20); }
    .forest  .adr-line { background: rgba(31,74,50,0.20);  }
    .adr-gem  { font-size: 5pt; line-height: 1; flex-shrink: 0; font-style: normal; }
    .burgund .adr-gem { color: rgba(139,26,53,0.52); }
    .cognac  .adr-gem { color: rgba(123,71,24,0.52); }
    .forest  .adr-gem { color: rgba(31,74,50,0.52);  }

    /* ── Gasteintrag: Name · Tisch X ── */
    .alpha-entry {
      display: flex; align-items: baseline;
      padding: var(--entry-py, 1.0mm) 0;
      text-align: left;
      font-family: 'Cormorant Garamond', serif;
    }
    .burgund .alpha-entry { border-bottom: 1px dotted rgba(139,26,53,0.10); }
    .cognac  .alpha-entry { border-bottom: 1px dotted rgba(123,71,24,0.10); }
    .forest  .alpha-entry { border-bottom: 1px dotted rgba(31,74,50,0.10);  }
    .alpha-entry:last-child { border-bottom: none; }

    .entry-name {
      font-size: var(--fs-entry, 8pt);
      flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .entry-sep {
      font-size: var(--fs-entry, 8pt);
      flex-shrink: 0; padding: 0 1.5mm;
      opacity: 0.35;
      font-family: 'DM Sans', sans-serif;
    }
    .entry-table {
      font-size: var(--fs-table, 7.5pt);
      flex-shrink: 0;
      min-width: var(--table-w, 11mm);
      text-align: right;
      letter-spacing: 0.3px;
      opacity: 0.68;
    }

    /* 1–2 Spalten: kompakt, zentriert */
    #alpha-list.compact .alpha-entry { width: fit-content; margin: 0 auto; }
    #alpha-list.compact .entry-name  { flex: 0 0 auto; }
    #alpha-list.compact .entry-table { min-width: 0; text-align: left; }

    /* ── Footer ── */
    #poster-footer { text-align: center; flex-shrink: 0; margin-top: 5mm; }
    .footer-ornament { display: inline-flex; align-items: center; gap: 3.5mm; }
    .f-line { display: inline-block; width: 22mm; height: 1px; }
    .burgund .f-line { background: rgba(139,26,53,0.28); }
    .cognac  .f-line { background: rgba(123,71,24,0.28); }
    .forest  .f-line { background: rgba(31,74,50,0.28);  }
    .f-dot { width: 3px; height: 3px; border-radius: 50%; display: inline-block; }
    .burgund .f-dot { background: rgba(139,26,53,0.45); }
    .cognac  .f-dot { background: rgba(123,71,24,0.45); }
    .forest  .f-dot { background: rgba(31,74,50,0.45);  }

    /* ── Demo-Wasserzeichen ── */
    .demo-watermark {
      position: absolute; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .demo-watermark span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72pt; font-weight: 600; letter-spacing: 18px; text-transform: uppercase;
      transform: rotate(-35deg);
      opacity: 0.13;
      white-space: nowrap; user-select: none;
    }
    .burgund .demo-watermark span { color: #8B1A35; }
    .cognac  .demo-watermark span { color: #7B4718; }
    .forest  .demo-watermark span { color: #1F4A32; }

    /* ── Shop-Button als Link ── */
    .btn-shop {
      flex: 2; padding: 10px; background: var(--wsa-dark); color: #fff; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 9px; text-transform: uppercase;
      letter-spacing: 1.5px; cursor: pointer; transition: background 0.15s;
      text-decoration: none; display: flex; align-items: center; justify-content: center;
      text-align: center;
    }
    .btn-shop:hover { background: #2e2e2e; }

  </style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="panel-form">
  <a href="/" class="atelier-back">← Wedding Story Atelier</a>
  <div class="panel-logo">Sitzplan</div>
  <div class="panel-tagline">Old Money Line · Demo · bis 65 Gäste</div>

  <label class="section-label">1 · Stil</label>
  <div class="btn-group">
    <button class="ui-btn active" onclick="setTheme('burgund',this)">Burgund</button>
    <button class="ui-btn"        onclick="setTheme('cognac',this)">Cognac</button>
    <button class="ui-btn"        onclick="setTheme('forest',this)">Forest</button>
  </div>

  <hr class="divider">

  <label class="section-label">2 · Titel</label>
  <input type="text" id="inp-title" placeholder="SITZPLAN" oninput="renderPoster()">

  <label class="section-label">Untertitel</label>
  <input type="text" id="inp-subtitle" placeholder="Anna &amp; Maximilian · 12. Juli 2026" oninput="renderPoster()">

  <hr class="divider">

  <label class="section-label">3 · Gästeliste einfügen</label>
  <p class="hint">Eine Person pro Zeile:<br>Vorname Nachname, Tisch 1<br><br>Namen eingeben oder Demo-Button drücken.</p>
  <textarea id="inp-guests"
    placeholder="Anna Müller, Tisch 1&#10;Herbert Schmidt, Tisch 5&#10;Lena Gruber, Tisch 1"
    oninput="onGuestsInput()"></textarea>
  <div class="guest-count" id="guest-count">0 Gäste</div>

  <div class="action-row">
    <button class="btn-demo" onclick="loadDemo()">&#9655; Demo</button>
    <a class="btn-shop" href="https://weddingstoryatelier.etsy.com/de/listing/4485890320/sitzplan-hochzeit-az-alphabetisch" target="_blank" rel="noopener">Im Shop bestellen →</a>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="panel-preview">
  <div id="preview-scaler">
    <div id="poster" class="burgund">
      <div class="poster-frame"></div>
      <div class="demo-watermark"><span>Demo</span></div>
      <div class="poster-body">

        <div id="poster-header">
          <div class="poster-title" id="poster-title">SITZPLAN</div>
          <div class="poster-subtitle" id="poster-subtitle" style="display:none;"></div>
          <div class="poster-rule"></div>
        </div>

        <div id="alpha-wrapper">
          <div id="alpha-list"></div>
        </div>

        <div id="poster-footer">
          <div class="footer-ornament">
            <span class="f-line"></span>
            <span class="f-dot"></span>
            <span class="f-line"></span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
let currentTheme = 'burgund';

// ── Basisgrößen ────────────────────────────────────────
const BASE = {
  letter:   13,
  entry:    8.0,
  table:    7.5,
  tableW:   11,
  groupMb:  4.5,
  entryPy:  1.0,
  headerMb: 1.8,
  letterMb: 1.2,
  ornW:     72,
  ornMb:    2.0,
};

// ── SVG Ornament ────────────────────────────────────────
const ORN_SMALL = `<svg viewBox="0 0 90 12" xmlns="http://www.w3.org/2000/svg"
  fill="none" stroke="currentColor" stroke-linecap="round">
  <line x1="6" y1="6" x2="37" y2="6" stroke-width="0.72" opacity="0.80"/>
  <line x1="53" y1="6" x2="84" y2="6" stroke-width="0.72" opacity="0.80"/>
  <path d="M 45,3 L 48,6 L 45,9 L 42,6 Z" fill="currentColor" stroke="none" opacity="0.82"/>
  <circle cx="6"  cy="6" r="1.4" fill="currentColor" stroke="none" opacity="0.58"/>
  <circle cx="84" cy="6" r="1.4" fill="currentColor" stroke="none" opacity="0.58"/>
</svg>`;

// ── Hilfsfunktionen ────────────────────────────────────
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toSortKey(n) {
  return n.toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]/g,'');
}
function parseGuests(raw) {
  if (!raw.trim()) return [];
  return raw.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const ci = line.lastIndexOf(',');
    if (ci === -1) return null;
    const name  = line.slice(0, ci).trim();
    const table = line.slice(ci + 1).trim();
    if (!name || !table) return null;
    const parts    = name.split(/\s+/).filter(Boolean);
    const lastName = parts[parts.length - 1] || name;
    return { name, table, sortKey: toSortKey(lastName), groupKey: lastName[0].toUpperCase() };
  }).filter(Boolean);
}

// ── Controls ──────────────────────────────────────────
function onGuestsInput() {
  const n  = parseGuests(document.getElementById('inp-guests').value).length;
  const el = document.getElementById('guest-count');
  el.textContent = n + ' Einträge' + (n > 65 ? ' — max. 65 Einträge empfohlen' : '');
  el.className   = 'guest-count' + (n > 65 ? ' warn' : '');
  renderPoster();
}
function setTheme(t, btn) {
  currentTheme = t;
  btn.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPoster();
}

// ── Inhaltsskalierung ─────────────────────────────────
function applyContentScale(s) {
  const p = document.getElementById('poster');
  p.style.setProperty('--fs-letter',  (BASE.letter   * s).toFixed(1) + 'pt');
  p.style.setProperty('--fs-entry',   (BASE.entry    * s).toFixed(1) + 'pt');
  p.style.setProperty('--fs-table',   (BASE.table    * s).toFixed(1) + 'pt');
  p.style.setProperty('--table-w',    (BASE.tableW   * s).toFixed(1) + 'mm');
  p.style.setProperty('--group-mb',   (BASE.groupMb  * s).toFixed(2) + 'mm');
  p.style.setProperty('--entry-py',   (BASE.entryPy  * s).toFixed(2) + 'mm');
  p.style.setProperty('--header-mb',  (BASE.headerMb * s).toFixed(2) + 'mm');
  p.style.setProperty('--letter-mb',  (BASE.letterMb * s).toFixed(2) + 'mm');
  p.style.setProperty('--orn-w',      (BASE.ornW     * s).toFixed(0) + 'px');
  p.style.setProperty('--orn-mb',     (BASE.ornMb    * s).toFixed(2) + 'mm');
}

function autoScale() {
  applyContentScale(1.0);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const wrapper = document.getElementById('alpha-wrapper');
    const list    = document.getElementById('alpha-list');
    if (!list.children.length) { scalePreview(); return; }
    const availH  = wrapper.clientHeight;
    const actualH = list.scrollHeight;
    if (!availH || !actualH) { scalePreview(); return; }
    const s = Math.min(availH / actualH * 0.975, 2.0);
    applyContentScale(Math.max(s, 0.62));
    requestAnimationFrame(() => scalePreview());
  }));
}

// ── Poster rendern ────────────────────────────────────
function renderPoster() {
  const poster = document.getElementById('poster');
  poster.className = currentTheme;

  document.getElementById('poster-title').textContent =
    document.getElementById('inp-title').value.trim() || 'SITZPLAN';
  const sub   = document.getElementById('inp-subtitle').value.trim();
  const subEl = document.getElementById('poster-subtitle');
  subEl.textContent   = sub;
  subEl.style.display = sub ? '' : 'none';

  const guests = parseGuests(document.getElementById('inp-guests').value);
  guests.sort((a, b) => a.sortKey.localeCompare(b.sortKey, 'de'));

  const cols = guests.length <= 20 ? 1 : guests.length <= 35 ? 2 : 3;
  const list2 = document.getElementById('alpha-list');
  list2.style.setProperty('--cols', cols);
  list2.classList.toggle('compact', cols <= 2);

  const groups = {};
  guests.forEach(g => {
    if (!groups[g.groupKey]) groups[g.groupKey] = [];
    groups[g.groupKey].push(g);
  });

  const list = document.getElementById('alpha-list');
  if (!guests.length) { list.innerHTML = ''; autoScale(); return; }

  list.innerHTML = Object.keys(groups).sort().map(letter =>
    `<div class="alpha-group">
      <div class="grp-orn">${ORN_SMALL}</div>
      <div class="alpha-letter">${letter}</div>
      <div class="alpha-diamond-rule">
        <span class="adr-line"></span>
        <span class="adr-gem">◆</span>
        <span class="adr-line"></span>
      </div>
      ${groups[letter].map(g =>
        `<div class="alpha-entry">
          <span class="entry-name">${esc(g.name)}</span>
          <span class="entry-sep">·</span>
          <span class="entry-table">${esc(g.table)}</span>
        </div>`
      ).join('')}
    </div>`
  ).join('');

  autoScale();
}

// ── Vorschau skalieren ────────────────────────────────
function scalePreview() {
  const scaler   = document.getElementById('preview-scaler');
  const panel    = document.querySelector('.panel-preview');
  const avail    = panel.clientWidth - 72;
  const posterEl = document.getElementById('poster');
  const scale    = Math.min(avail / posterEl.offsetWidth, 1);
  scaler.style.transform = `scale(${scale})`;
  scaler.style.height    = (posterEl.offsetHeight * scale) + 'px';
  scaler.classList.add('wsa-ready');
}

// ── Demo laden ────────────────────────────────────────
function loadDemo() {

  onGuestsInput();
}

// ── Start ─────────────────────────────────────────────
renderPoster();
window.addEventListener('resize', scalePreview);
</script>
