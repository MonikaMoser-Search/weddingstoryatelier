<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Golden Anniversary · Invitation · Wedding Story Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ===== Local OFL fonts ================================================== */
@font-face {
  font-family: 'Great Vibes';
  src: url('/Schriftarten/Great_Vibes/GreatVibes-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
@font-face {
  font-family: 'Cinzel';
  src: url('/Schriftarten/Cinzel/Cinzel-Variable.ttf') format('truetype-variations');
  font-weight: 400 700;
  font-style: normal;
  font-display: block;
}
@font-face {
  font-family: 'Bodoni Moda';
  src: url('/Schriftarten/Bodoni_Moda/BodoniModa-Variable.ttf') format('truetype-variations');
  font-weight: 400 900;
  font-style: normal;
  font-display: block;
}
@font-face {
  font-family: 'Cormorant Garamond';
  src: url('/Schriftarten/Cormorant_Garamond/CormorantGaramond-Italic-VariableFont_wght.ttf') format('truetype-variations');
  font-weight: 300 700;
  font-style: italic;
  font-display: block;
}
@font-face {
  font-family: 'Playfair Display';
  src: url('/Schriftarten/static/PlayfairDisplay-Italic.ttf') format('truetype');
  font-weight: 400;
  font-style: italic;
  font-display: block;
}

/* ===== Palette ========================================================== */
:root {
  --gold:        #C9A24A;   /* Champagne-Gold — hero „50" and names */
  --gold-soft:   rgba(201,162,74,0.55);
  --gold-faint:  rgba(201,162,74,0.20);
  --mushroom:    #9D907F;   /* Soft mushroom — cool-neutral accent against warm gold; parallel to mauve on silver */
  --mushroom-soft: rgba(157,144,127,0.95);   /* RSVP marginalia: deliberately more pigmented so the reply hint stays readable on phone */
  --ink:         #2A2826;
  --ink-soft:    #5A5854;
  --paper:       #FFFFFF;
  --bg:          #E8E4DE;
}

/* ===== Screen frame ===================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: 'Cinzel', serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 64px;
}

/* ===== Buyer UI (hidden on print) ====================================== */
.buyer-only { width: 100%; max-width: 600px; }
.buyer-bar {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.buyer-btn {
  font-family: 'Cinzel', serif;
  font-size: 11pt;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 22px;
  background: var(--ink);
  border: 1px solid var(--ink);
  color: #fff;
  cursor: pointer;
  transition: all .15s ease;
}
.buyer-btn:hover { background: var(--gold); border-color: var(--gold); }
.buyer-hint {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 10pt;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  margin: 0 0 28px;
  line-height: 1.6;
}

/* ===== The card (5 × 7 in) ============================================= */
.card {
  width: 127mm;
  height: 178mm;
  background: var(--paper);
  position: relative;
  padding: 10mm 10mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}

/* ===== Hero: "50th Anniversary" ======================================== */
.hero {
  font-family: 'Great Vibes', cursive;
  color: var(--gold);
  font-weight: 400;
  line-height: 0.9;
  margin: 0;
  padding: 0;
  text-align: center;
}
.hero-50 {
  font-family: 'Bodoni Moda', 'Prata', serif;
  font-weight: 900;
  font-size: 115pt;
  display: block;
  line-height: 0.85;
  letter-spacing: -0.02em;
}

/* ===== Intro block ====================================================== */
.intro {
  margin-top: 2mm;
  font-family: 'Cinzel', serif;
  font-size: 8.5pt;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mushroom);
  line-height: 1.7;
}

/* ===== Names (Cormorant Italic, three-line cascade) ==================== */
.names {
  margin-top: 5mm;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--gold);
  width: 100%;
}
.name-row {
  width: 100mm;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.05;
}
.name-row--1 { transform: translateX(-4mm); margin-bottom: -2.5mm; }
.name-row--2 { transform: translateX(4mm); margin-top: -2.5mm; }
.name-amp {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 400;
  color: var(--gold);
  font-size: 28pt;
  line-height: 1;
  text-align: center;
  margin: 0;
  transform: translateX(-1mm);
}
.name-input {
  font-family: 'Cormorant Garamond', serif !important;
  font-style: italic !important;
  font-weight: 500 !important;
  color: var(--gold) !important;
  font-size: 42pt !important;
  text-align: center;
  width: 100%;
  line-height: 1.05;
}

/* ===== Date / time ====================================================== */
.datetime {
  margin-top: 4mm;
  font-family: 'Cinzel', serif;
  font-size: 10pt;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mushroom);
  width: 100%;
}

/* ===== Venue ============================================================ */
.venue {
  margin-top: 5mm;
  display: flex;
  flex-direction: column;
  gap: 1.4mm;
  font-family: 'Cinzel', serif;
  font-size: 9.5pt;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mushroom);
  line-height: 1.6;
  width: 100%;
}

/* ===== Reception (optional: "Dinner and dancing to follow") =========== */
.reception {
  margin-top: 4mm;
  font-family: 'Cinzel', serif;
  font-size: 9pt;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mushroom);
  width: 100%;
}

/* ===== RSVP ============================================================ */
.rsvp {
  margin-top: 5mm;
  font-family: 'Cinzel', serif;
  font-size: 8.5pt;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mushroom-soft);
  line-height: 1.7;
  width: 100%;
}

/* ===== Ornament ========================================================= */
.ornament {
  margin-top: 4mm;
  color: var(--gold);
  font-size: 12pt;
  line-height: 1;
}
.ornament svg { display: block; margin: 0 auto; }

/* ===== Input styling =================================================== */
.field {
  background: transparent;
  border: none;
  outline: none;
  font: inherit;
  color: inherit;
  text-align: inherit;
  padding: 2px 4px;
  width: 100%;
  transition: background .12s ease, box-shadow .12s ease;
  border-radius: 2px;
}
.field:hover  { background: rgba(201,162,74,0.05); }
.field:focus  { background: rgba(201,162,74,0.10); box-shadow: 0 0 0 1px var(--gold-faint); }
.field::placeholder { color: var(--gold-soft); font-style: inherit; opacity: 1; }
.names .field::placeholder { color: rgba(201,162,74,0.40); }
input.field { line-height: 1.2; }

/* ===== Print ============================================================ */
@media print {
  @page {
    size: 5in 7in;
    margin: 0;
  }
  html, body {
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 5in !important;
    height: 7in !important;
    min-height: 0 !important;
    display: block !important;
  }
  .buyer-only { display: none !important; }
  .card {
    box-shadow: none !important;
    width: 5in;
    height: 7in;
    margin: 0;
    overflow: hidden;
    page-break-inside: avoid;
  }
  .field {
    background: transparent !important;
    box-shadow: none !important;
  }
  .field::placeholder { color: transparent !important; }
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}
</style>
</head>
<body>

<div class="buyer-only">
  <div class="buyer-bar">
    <button class="buyer-btn" id="btnPrint" type="button">Print / PDF</button>
  </div>
  <p class="buyer-hint">
    Click into the card to enter your details. Then choose „Print / PDF". Tip: enable background graphics in the print dialog. Paper format: 5 × 7 in.
  </p>
</div>

<article class="card">

  <h1 class="hero">
    <span class="hero-50">50</span>
  </h1>

  <p class="intro">
    We warmly invite you to the<br>
    Golden Wedding Anniversary celebration of
  </p>

  <div class="names">
    <div class="name-row name-row--1">
      <input class="field name-input" type="text" id="fName1" placeholder="Elizabeth">
    </div>
    <div class="name-amp" aria-hidden="true">&amp;</div>
    <div class="name-row name-row--2">
      <input class="field name-input" type="text" id="fName2" placeholder="Thomas">
    </div>
  </div>

  <div class="datetime">
    <input class="field" type="text" id="fDate" placeholder="Saturday, June 14, 2026 · 4:00 PM">
  </div>

  <div class="venue">
    <input class="field" type="text" id="fVenueName"   placeholder="The Maple Grove Inn">
    <input class="field" type="text" id="fVenueStreet" placeholder="789 Oak Hill Road">
    <input class="field" type="text" id="fVenueCity"   placeholder="Charlotte, NC 28210">
  </div>

  <div class="reception">
    <input class="field" type="text" id="fReception" placeholder="Dinner and dancing to follow">
  </div>

  <div class="rsvp">
    <input class="field" type="text" id="fRsvp" placeholder="Kindly RSVP by March 15 · +1 704 555 7890">
  </div>

  <div class="ornament" aria-hidden="true">
    <svg width="60" height="22" viewBox="0 0 60 22" fill="none" stroke="currentColor" stroke-width="0.9">
      <path d="M2 8 Q 12 18 22 8" />
      <path d="M38 8 Q 48 18 58 8" />
      <path d="M28 11 C 28 8, 32 8, 32 11 C 32 8, 36 8, 36 11 C 36 15, 32 18, 32 18 C 32 18, 28 15, 28 11 Z" fill="currentColor"/>
    </svg>
  </div>

</article>

<script>
  document.getElementById('btnPrint').addEventListener('click', () => window.print());

  // ===== Autofit: Canvas-based measurement (deterministic) ==============
  const _measureCtx = document.createElement('canvas').getContext('2d');

  function autofitField(input, maxPt, minPt, swashSafety = 1.0) {
    function fit() {
      const cs = getComputedStyle(input);
      const family = cs.fontFamily;
      const style  = cs.fontStyle  || 'normal';
      const weight = cs.fontWeight || '400';
      const text   = input.value || input.placeholder || '';

      function widthAt(pt) {
        const px = (pt * 4 / 3).toFixed(2);
        _measureCtx.font = `${style} ${weight} ${px}px ${family}`;
        return _measureCtx.measureText(text).width;
      }

      const available = (input.clientWidth - 4) / swashSafety;
      let pt = maxPt;
      const needed = widthAt(maxPt);
      if (needed > available) {
        pt = Math.max(minPt, maxPt * (available / needed));
      }
      input.style.fontSize = pt.toFixed(1) + 'pt';
    }

    input.addEventListener('input', fit);
    return fit;
  }

  const fits = [];
  function setup() {
    fits.push(autofitField(document.getElementById('fName1'),     42, 22, 1.08));
    fits.push(autofitField(document.getElementById('fName2'),     42, 22, 1.08));
    fits.push(autofitField(document.getElementById('fDate'),      10, 7,   1.15));
    fits.push(autofitField(document.getElementById('fVenueName'),  9.5, 7, 1.15));
    fits.push(autofitField(document.getElementById('fVenueStreet'),9.5, 7, 1.15));
    fits.push(autofitField(document.getElementById('fVenueCity'),  9.5, 7, 1.15));
    fits.push(autofitField(document.getElementById('fReception'),  9, 7, 1.15));
    fits.push(autofitField(document.getElementById('fRsvp'),       8.5, 6.5, 1.15));
    fits.forEach(f => f());
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(setup);
  } else {
    window.addEventListener('load', setup);
  }
</script>

</body>
</html>
