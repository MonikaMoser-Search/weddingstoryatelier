<!DOCTYPE html>
<html lang="de" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Tischplan — Old Money Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="fonts_base64.js?v=20260429"></script>
  <link rel="stylesheet" href="/atelier/wsa_panel.css">
  <style>

    .count-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .count-btn {
      width: 26px; height: 26px; border: 1px solid #eee; background: #fff;
      cursor: pointer; font-size: 15px; display: flex; align-items: center;
      justify-content: center; transition: all 0.15s; color: #666; flex-shrink: 0;
    }
    .count-btn:hover { border-color: #1A1A1A; color: #1A1A1A; }
    .count-num { font-size: 18px; font-family: 'Playfair Display', serif; width: 30px; text-align: center; color: var(--dark); }
    .count-sub { font-size: 9px; color: #bbb; }

    .tables-wrap { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding-right: 2px; min-height: 0; }
    .t-card { border: 1px solid #f0f0f0; padding: 9px 11px; background: #fafafa; transition: border-color 0.15s; }
    .t-card:hover { border-color: #e0d8cc; }
    .t-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .t-num { font-size: 8px; color: #888; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    .t-name-in {
      flex: 1; padding: 4px 7px; border: 1px solid #eee;
      font-family: 'Cormorant Garamond', serif; font-size: 13px;
      outline: none; transition: border-color 0.2s; background: #fff;
    }
    .t-name-in:focus { border-color: #1A1A1A; }
    .t-guests {
      width: 100%; min-height: 54px; padding: 5px 7px;
      border: 1px solid #eee; font-family: 'DM Sans', sans-serif;
      font-size: 11px; resize: vertical; outline: none;
      line-height: 1.7; transition: border-color 0.2s; background: #fff;
    }
    .t-guests:focus { border-color: #1A1A1A; }
    .t-gc { font-size: 8.5px; color: #ccc; text-align: right; margin-top: 3px; }

    .duplex-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .range-val { font-size: 9px; color: #aaa; width: 30px; text-align: right; flex-shrink: 0; }

    /* ── POSTER ── */
    #poster {
      width: 210mm; min-height: 297mm;
      position: relative; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      display: flex; flex-direction: column;
    }

    /* ── THEMES Old Money ── */
    #poster.burgund { background-color: #FEF8F7; color: #8B1A35; border: 14px solid #8B1A35; }
    #poster.cognac  { background-color: #FEF9F5; color: #7B4718; border: 14px solid #7B4718; }
    #poster.forest  { background-color: #F7FAF7; color: #1F4A32; border: 14px solid #1F4A32; }

    /* Inner frame */
    .poster-frame { position: absolute; inset: 7mm; pointer-events: none; z-index: 1; }
    .burgund .poster-frame { border: 1px solid rgba(139,26,53,0.38); }
    .cognac  .poster-frame { border: 1px solid rgba(123,71,24,0.38); }
    .forest  .poster-frame { border: 1px solid rgba(31,74,50,0.38);  }

    /* Body */
    .poster-body {
      flex: 1; display: flex; flex-direction: column;
      padding: 0 14mm; position: relative; z-index: 2;
    }
    .poster-body::before { content: ''; flex: 45; min-height: 12mm; }
    .poster-body::after  { content: ''; flex: 55; min-height: 14mm; }

    /* Header */
    .poster-header { text-align: center; margin-bottom: 7mm; }
    .poster-eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: var(--fs-eyebrow, 7pt);
      letter-spacing: 5px; text-transform: uppercase; opacity: 0.42; margin-bottom: 3mm;
    }
    .poster-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: var(--fs-title, 26pt);
      font-weight: 300; letter-spacing: 7px; text-transform: uppercase; line-height: 1.1;
    }
    .burgund .poster-title { color: #8B1A35; }
    .cognac  .poster-title { color: #7B4718; }
    .forest  .poster-title { color: #1F4A32; }

    .poster-subtitle {
      margin-top: 2.5mm; font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: var(--fs-sub, 10.5pt);
      letter-spacing: 1.5px; opacity: 0.62;
    }
    .poster-rule { width: 34mm; height: 1px; margin: 5mm auto 0; }
    .burgund .poster-rule { background: rgba(139,26,53,0.38); }
    .cognac  .poster-rule { background: rgba(123,71,24,0.38); }
    .forest  .poster-rule { background: rgba(31,74,50,0.38);  }

    /* ── CARD GRID ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols, 3), 1fr);
      gap: 9mm 8mm;
    }
    .card-grid.cols-1 { max-width: 90mm;  margin-left: auto; margin-right: auto; }
    .card-grid.cols-2 { max-width: 156mm; margin-left: auto; margin-right: auto; }

    /* ── TABLE CARD ── */
    .table-card { text-align: center; display: flex; flex-direction: column; }
    .card-grid.density-spacious .table-card { padding: 0 4px; }
    .card-grid.density-normal   .table-card { padding: 0 3px; }
    .card-grid.density-compact  .table-card { padding: 0 2px; }

    /* ── ORNAMENT WRAPPER ── */
    .card-orn-wrap { display: block; line-height: 0; flex-shrink: 0; }
    .card-orn-wrap svg { display: inline-block; width: 100%; height: auto; }
    .card-orn-wrap.orn-lg svg { max-width: 138px; }
    .card-orn-wrap.orn-sm svg { max-width:  76px; }
    .card-orn-wrap.orn-top { margin-bottom: 2.5mm; }
    .card-orn-wrap.orn-bot { margin-top: auto; padding-top: 2.5mm; }
    .burgund .card-orn-wrap { color: rgba(139,26,53,0.65); }
    .cognac  .card-orn-wrap { color: rgba(123,71,24,0.65); }
    .forest  .card-orn-wrap { color: rgba(31,74,50,0.65);  }

    /* Card internals */
    .card-num {
      font-family: 'DM Sans', sans-serif;
      font-size: var(--fs-num, 6.5pt);
      text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 1.2mm;
    }
    .burgund .card-num { color: rgba(139,26,53,0.55); }
    .cognac  .card-num { color: rgba(123,71,24,0.55); }
    .forest  .card-num { color: rgba(31,74,50,0.55);  }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: var(--fs-name, 11pt);
      font-weight: 400; margin-bottom: 2.5mm; line-height: 1.2;
    }
    .density-compact .card-name { margin-bottom: 1.5mm; }
    .burgund .card-name { color: #8B1A35; }
    .cognac  .card-name { color: #7B4718; }
    .forest  .card-name { color: #1F4A32; }

    /* Trennlinie */
    .card-rule {
      display: flex; align-items: center; gap: 5px;
      margin-bottom: 2.5mm;
    }
    .density-compact .card-rule { margin-bottom: 1.5mm; }
    .card-rule::before, .card-rule::after { content: ''; flex: 1; height: 1px; }
    .burgund .card-rule::before, .burgund .card-rule::after { background: rgba(139,26,53,0.22); }
    .cognac  .card-rule::before, .cognac  .card-rule::after { background: rgba(123,71,24,0.22); }
    .forest  .card-rule::before, .forest  .card-rule::after { background: rgba(31,74,50,0.22);  }

    .card-orn {
      font-size: 5.5pt; line-height: 1; flex-shrink: 0;
      letter-spacing: 0; font-style: normal;
    }
    .burgund .card-orn { color: rgba(139,26,53,0.52); }
    .cognac  .card-orn { color: rgba(123,71,24,0.52); }
    .forest  .card-orn { color: rgba(31,74,50,0.52);  }

    .guest-entry {
      font-family: 'Cormorant Garamond', serif;
      font-size: var(--fs-guest, 8.5pt);
      letter-spacing: 0.2px; padding: 1.2mm 0; line-height: 1.25;
    }
    .density-compact .guest-entry { padding: 0.7mm 0; }
    .burgund .guest-entry { border-bottom: 1px dotted rgba(139,26,53,0.12); }
    .cognac  .guest-entry { border-bottom: 1px dotted rgba(123,71,24,0.10); }
    .forest  .guest-entry { border-bottom: 1px dotted rgba(31,74,50,0.10);  }
    .guest-entry:last-child { border-bottom: none; }

    /* Footer */
    .poster-footer { text-align: center; margin-top: 6mm; }
    .footer-ornament { display: inline-flex; align-items: center; gap: 3.5mm; }
    .f-line { display: inline-block; width: 22mm; height: 1px; }
    .burgund .f-line { background: rgba(139,26,53,0.28); }
    .cognac  .f-line { background: rgba(123,71,24,0.28); }
    .forest  .f-line { background: rgba(31,74,50,0.28);  }
    .f-dot { width: 3px; height: 3px; border-radius: 50%; display: inline-block; }
    .burgund .f-dot { background: rgba(139,26,53,0.45); }
    .cognac  .f-dot { background: rgba(123,71,24,0.45); }
    .forest  .f-dot { background: rgba(31,74,50,0.45);  }

  </style>

<body>

<!-- LEFT PANEL -->
<div class="panel-form">
  <div class="panel-logo" id="panel-logo">Tischplan</div>
  <div class="panel-tagline">Old Money Line · Cards Edition</div>

  <div class="btn-group" style="margin-bottom:10px;">
    <button class="ui-btn active" onclick="setLang('de',this)">DE</button>
    <button class="ui-btn" onclick="setLang('en',this)">EN</button>
  </div>

  <label class="section-label" data-de="1 · Stil" data-en="1 · Style">1 · Stil</label>
  <div class="btn-group">
    <button class="ui-btn active" onclick="setTheme('burgund',this)">Burgund</button>
    <button class="ui-btn" onclick="setTheme('cognac',this)">Cognac</button>
    <button class="ui-btn" onclick="setTheme('forest',this)">Forest</button>
  </div>

  <hr class="divider">

  <label class="section-label" data-de="2 · Titel" data-en="2 · Title">2 · Titel</label>
  <input type="text" id="inp-title" placeholder="TISCHPLAN" oninput="renderPoster()">

  <label class="section-label" data-de="Untertitel" data-en="Subtitle">Untertitel</label>
  <input type="text" id="inp-subtitle" placeholder="Anna &amp; Maximilian · 12. Juli 2026" oninput="renderPoster()">

  <hr class="divider">

  <label class="section-label" data-de="3 · Anzahl Tische" data-en="3 · Number of Tables">3 · Anzahl Tische</label>
  <div class="count-row">
    <button class="count-btn" onclick="changeCount(-1)">−</button>
    <span class="count-num" id="count-num">8</span>
    <button class="count-btn" onclick="changeCount(1)">+</button>
    <span class="count-sub">max. 12</span>
  </div>

  <label class="section-label" style="margin-bottom:8px;" data-de="4 · Namen eintragen · eine Person pro Zeile" data-en="4 · Enter guests · one name per line">4 · Namen eintragen · eine Person pro Zeile</label>
  <div class="tables-wrap" id="tables-wrap"></div>

  <hr class="divider" style="flex-shrink:0;">

  <label class="section-label" data-de="Schriftgröße" data-en="Font Size">Schriftgröße</label>
  <div class="duplex-row">
    <input type="range" id="font-slider" min="70" max="130" value="100" step="5" oninput="updateFontScale(this.value)">
    <span class="range-val" id="font-val">100%</span>
  </div>
  <div class="btn-group" style="margin-bottom: 6px;">
    <button class="ui-btn" onclick="setFontPreset(80,this)">A4</button>
    <button class="ui-btn" onclick="setFontPreset(115,this)">A3</button>
    <button class="ui-btn active" onclick="setFontPreset(100,this)">Standard</button>
  </div>

  <label class="section-label" data-de="5 · Druckformat" data-en="5 · Print Format">5 · Druckformat</label>
  <select id="sel-format">
    <option value="a4" selected>A4 — 210 × 297 mm</option>
    <option value="letter">Letter — 216 × 279 mm (US)</option>
    <option value="a3">A3 — 297 × 420 mm</option>
    <option value="tabloid">Tabloid — 279 × 432 mm (US)</option>
    <option value="a2">A2 — 420 × 594 mm</option>
    <option value="a1">A1 — 594 × 841 mm</option>
    <option value="a0">A0 — 841 × 1189 mm</option>
  </select>

  <div class="action-row">
    <button class="btn-demo" onclick="loadDemo()">&#9655; Demo</button>
    <button class="btn-export" onclick="exportPDF()">Export PDF</button>
  </div>
  <span class="section-label" style="font-size:10px;margin-top:10px;margin-bottom:4px;display:block">Modus</span>
  <div class="btn-group" id="output-btns" style="margin-bottom:8px">
    <button type="button" class="ui-btn active" id="btn-out-home"  onclick="setOutput('home',this)">Heimdruck</button>
    <button type="button" class="ui-btn"        id="btn-out-print" onclick="setOutput('print',this)">Druckerei</button>
  </div>
  <input type="checkbox" id="chk-bleed" style="display:none">
  <script>
    function setOutput(mode, btn) {
      document.querySelectorAll('#output-btns .ui-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('chk-bleed').checked = (mode === 'print');
    }
  </script>
  <div class="print-hint">
    <span class="print-hint-de">Heimdruck = ohne Beschnitt, Druckerei-Modus aktiviert 3 mm Beschnittzugabe. Datei in sRGB.</span>
    <span class="print-hint-en">Home = no bleed, Print shop mode adds 3 mm bleed. File in sRGB.</span>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="panel-preview">
  <div id="preview-scaler">
    <div id="poster" class="burgund">
      <div class="poster-frame"></div>
      <div class="poster-body">

        <div class="poster-header">
          <div class="poster-title" id="poster-title">TISCHPLAN</div>
          <div class="poster-subtitle" id="poster-subtitle" style="display:none;"></div>
          <div class="poster-rule"></div>
        </div>

        <div class="card-grid" id="card-grid"></div>

        <div class="poster-footer">
          <div class="footer-ornament">
            <span class="f-line"></span>
            <span class="f-dot"></span>
            <span class="f-line"></span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- SPINNER -->
<div id="pdf-spinner">
  <div class="spin-ring"></div>
  <span>PDF wird erstellt …</span>
</div>

<script>
let currentTheme = 'burgund';
let currentLang  = 'de';
let fontScale = 1.0;
let tableCount = 8;
let tableData = [];

const I18N = {
  de: {
    logo:          'Tischplan',
    tableLabel:    i => `Tisch ${i + 1}`,
    guestsCount:   n => n > 0 ? n + ' Gäste' : '',
    namePh:        'Tischname (optional)',
    guestsPh:      'Max Müller\nAnna Schmidt\n...',
    titlePh:       'TISCHPLAN',
    subtitlePh:    'Anna & Maximilian · 12. Juli 2026',
    cardNumLabel:  i => `Tisch ${i + 1}`,
    pdfTableLabel: i => `Tisch ${i + 1}`,
    pdfTitleFb:    'TISCHPLAN',
  },
  en: {
    logo:          'Seating Chart',
    tableLabel:    i => `Table ${i + 1}`,
    guestsCount:   n => n > 0 ? n + ' Guests' : '',
    namePh:        'Table name (optional)',
    guestsPh:      'Jane Smith\nJohn Doe\n...',
    titlePh:       'SEATING CHART',
    subtitlePh:    'Anna & Maximilian · July 12, 2026',
    cardNumLabel:  i => `Table ${i + 1}`,
    pdfTableLabel: i => `Table ${i + 1}`,
    pdfTitleFb:    'SEATING CHART',
  }
};

function setLang(lang, btn) {
  currentLang = lang;
  btn.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-logo').textContent = I18N[lang].logo;
  document.querySelectorAll('[data-de][data-en]').forEach(el => {
    el.textContent = el.dataset[lang];
  });
  document.getElementById('inp-title').placeholder    = I18N[lang].titlePh;
  document.getElementById('inp-subtitle').placeholder = I18N[lang].subtitlePh;
  renderTableInputs();
  renderPoster();
}

// ── DATA ──────────────────────────────────────────────
function initTableData(count) {
  const old = tableData.slice();
  tableData = Array.from({ length: count }, (_, i) => ({
    name:       old[i] ? old[i].name       : '',
    guests_raw: old[i] ? old[i].guests_raw : '',
  }));
}

function renderTableInputs() {
  const wrap = document.getElementById('tables-wrap');
  wrap.innerHTML = '';
  tableData.forEach((t, i) => {
    const n = parseGuests(t.guests_raw).length;
    const el = document.createElement('div');
    el.className = 't-card';
    const L = I18N[currentLang];
    el.innerHTML = `
      <div class="t-head">
        <span class="t-num">${L.tableLabel(i)}</span>
        <input class="t-name-in" type="text" placeholder="${L.namePh}"
          value="${esc(t.name)}" oninput="tableData[${i}].name=this.value;renderPoster()">
      </div>
      <textarea class="t-guests" placeholder="${L.guestsPh.replace(/\n/g,'&#10;')}"
        oninput="tableData[${i}].guests_raw=this.value;updateGC(${i},this);renderPoster()">${esc(t.guests_raw)}</textarea>
      <div class="t-gc" id="gc-${i}">${L.guestsCount(n)}</div>
    `;
    wrap.appendChild(el);
  });
}

function updateGC(i, el) {
  const n = parseGuests(el.value).length;
  document.getElementById('gc-' + i).textContent = I18N[currentLang].guestsCount(n);
}

// ── HELPERS ───────────────────────────────────────────
function parseGuests(raw) {
  return raw ? raw.split('\n').map(l => l.trim()).filter(Boolean) : [];
}
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── CONTROLS ──────────────────────────────────────────
function changeCount(d) {
  const n = Math.max(1, Math.min(12, tableCount + d));
  if (n === tableCount) return;
  tableCount = n;
  document.getElementById('count-num').textContent = n;
  initTableData(n);
  renderTableInputs();
  renderPoster();
}

function setTheme(t, btn) {
  currentTheme = t;
  btn.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPoster();
}

function updateFontScale(val) {
  fontScale = val / 100;
  document.getElementById('font-val').textContent = val + '%';
  applyFontScale();
}
function setFontPreset(val, btn) {
  fontScale = val / 100;
  document.getElementById('font-slider').value = val;
  document.getElementById('font-val').textContent = val + '%';
  btn.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFontScale();
}
function applyFontScale() {
  const p = document.getElementById('poster');
  const s = fontScale;
  p.style.setProperty('--fs-title',   (26   * s).toFixed(1) + 'pt');
  p.style.setProperty('--fs-sub',     (10.5 * s).toFixed(1) + 'pt');
  p.style.setProperty('--fs-name',    (11   * s).toFixed(1) + 'pt');
  p.style.setProperty('--fs-guest',   (8.5  * s).toFixed(1) + 'pt');
  p.style.setProperty('--fs-num',     (6.5  * s).toFixed(1) + 'pt');
}

// ── SVG ORNAMENTS ─────────────────────────────────────
const ORN_LARGE = `<svg viewBox="0 0 180 26" xmlns="http://www.w3.org/2000/svg"
  fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 22,13 Q 90,4 158,13"  stroke-width="0.85"/>
  <path d="M 22,13 Q 90,22 158,13" stroke-width="0.85"/>
  <path d="M 22,13 C 15,13 10,9 12,5 C 14,2 18,5 16,9 C 15,11 12,10 13,8"
        stroke-width="0.82"/>
  <path d="M 158,13 C 165,13 170,9 168,5 C 166,2 162,5 164,9 C 165,11 168,10 167,8"
        stroke-width="0.82"/>
  <path d="M 90,8 L 94,13 L 90,18 L 86,13 Z" fill="currentColor" stroke="none" opacity="0.88"/>
  <circle cx="22"  cy="13" r="1.8" fill="currentColor" stroke="none" opacity="0.62"/>
  <circle cx="158" cy="13" r="1.8" fill="currentColor" stroke="none" opacity="0.62"/>
</svg>`;

const ORN_SMALL = `<svg viewBox="0 0 90 12" xmlns="http://www.w3.org/2000/svg"
  fill="none" stroke="currentColor" stroke-linecap="round">
  <line x1="6" y1="6" x2="37" y2="6" stroke-width="0.72" opacity="0.80"/>
  <line x1="53" y1="6" x2="84" y2="6" stroke-width="0.72" opacity="0.80"/>
  <path d="M 45,3 L 48,6 L 45,9 L 42,6 Z" fill="currentColor" stroke="none" opacity="0.82"/>
  <circle cx="6"  cy="6" r="1.4" fill="currentColor" stroke="none" opacity="0.58"/>
  <circle cx="84" cy="6" r="1.4" fill="currentColor" stroke="none" opacity="0.58"/>
</svg>`;

// ── POSTER RENDER ─────────────────────────────────────
function renderPoster() {
  const poster = document.getElementById('poster');
  poster.className = currentTheme;

  document.getElementById('poster-title').textContent =
    document.getElementById('inp-title').value.trim() || I18N[currentLang].titlePh;

  const sub   = document.getElementById('inp-subtitle').value.trim();
  const subEl = document.getElementById('poster-subtitle');
  subEl.textContent  = sub;
  subEl.style.display = sub ? '' : 'none';

  const cols    = tableCount <= 2 ? 1 : tableCount <= 6 ? 2 : 3;
  const density = tableCount <= 4 ? 'density-spacious' : tableCount <= 8 ? 'density-normal' : 'density-compact';
  const colsCls = tableCount <= 2 ? 'cols-1' : tableCount <= 6 ? 'cols-2' : 'cols-3';

  const grid = document.getElementById('card-grid');
  grid.className = `card-grid ${density} ${colsCls}`;
  grid.style.setProperty('--cols', cols);

  const isSpacious = tableCount <= 4;
  const isCompact  = tableCount >= 9;
  const topOrn  = isSpacious ? `<div class="card-orn-wrap orn-top orn-lg">${ORN_LARGE}</div>`
                             : `<div class="card-orn-wrap orn-top orn-sm">${ORN_SMALL}</div>`;
  const botOrn  = isCompact  ? ''
                             : `<div class="card-orn-wrap orn-bot orn-sm">${ORN_SMALL}</div>`;

  grid.innerHTML = tableData.map((t, i) => {
    const guests  = parseGuests(t.guests_raw);
    const hasName = t.name && t.name.trim();
    return `
      <div class="table-card">
        ${topOrn}
        <div class="card-num">${I18N[currentLang].cardNumLabel(i)}</div>
        ${hasName ? `<div class="card-name">${esc(t.name)}</div>` : ''}
        <div class="card-rule"><span class="card-orn">◆</span></div>
        <div class="card-guests">
          ${guests.length
            ? guests.map(g => `<div class="guest-entry">${esc(g)}</div>`).join('')
            : `<div class="guest-entry" style="opacity:0.2;font-style:italic;">—</div>`}
        </div>
        ${botOrn}
      </div>`;
  }).join('');

  setTimeout(scalePreview, 20);
}

// ── SCALE PREVIEW ─────────────────────────────────────
function scalePreview() {
  const scaler   = document.getElementById('preview-scaler');
  const panel    = document.querySelector('.panel-preview');
  const avail    = panel.clientWidth - 72;
  const posterEl = document.getElementById('poster');
  const scale    = Math.min(avail / posterEl.offsetWidth, 1);
  scaler.style.transform = `scale(${scale})`;
  scaler.style.height    = (posterEl.offsetHeight * scale) + 'px';
}

// ── PDF EXPORT ────────────────────────────────────────
function exportPDF() {
  const spinner = document.getElementById('pdf-spinner');
  spinner.style.display = 'flex';
  try { exportPDF_vector(); }
  catch(e) { alert('Export fehlgeschlagen: ' + e.message); console.error(e); }
  finally { spinner.style.display = 'none'; }
}

function exportPDF_vector() {
  const { jsPDF } = window.jspdf;

  const formatKey = (document.getElementById('sel-format') || {}).value || 'a4';
  const bleedMM   = document.getElementById('chk-bleed').checked ? 3 : 0;
  const FMT = { a4:[210,297], letter:[216,279], a3:[297,420], tabloid:[279,432], a2:[420,594], a1:[594,841], a0:[841,1189] };
  const [baseW, baseH] = FMT[formatKey] || FMT.a4;
  const fS   = baseW / 210;
  const docW = baseW + bleedMM * 2;
  const docH = baseH + bleedMM * 2;
  const bx   = bleedMM, by = bleedMM;

  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [docW, docH] });
  if (window.WSA_FONTS) WSA_FONTS.registerWith(pdf);

  const THEMES = {
    burgund: { tc: [114, 39,  55], bg: [254, 248, 247], hasBorder: true  },
    cognac:  { tc: [123, 71,  24], bg: [254, 249, 245], hasBorder: true  },
    forest:  { tc: [ 31, 74,  50], bg: [247, 250, 247], hasBorder: true  },
  };
  const th = THEMES[currentTheme] || THEMES.burgund;
  const tc = th.tc, bg = th.bg;

  function bl(rgb, op) {
    return [
      Math.round(rgb[0] * op + bg[0] * (1 - op)),
      Math.round(rgb[1] * op + bg[1] * (1 - op)),
      Math.round(rgb[2] * op + bg[2] * (1 - op)),
    ];
  }
  const sf = (rgb) => pdf.setFillColor(rgb[0], rgb[1], rgb[2]);
  const sd = (rgb) => pdf.setDrawColor(rgb[0], rgb[1], rgb[2]);
  const st = (rgb) => pdf.setTextColor(rgb[0], rgb[1], rgb[2]);

  function setFont(name, style) {
    const keyMap = {
      'CormorantGaramond-light':    'CormorantGaramond-Light',
      'CormorantGaramond-normal':   'CormorantGaramond-Regular',
      'CormorantGaramond-italic':   'CormorantGaramond-Italic',
      'CormorantGaramond-semibold': 'CormorantGaramond-SemiBold',
      'PlayfairDisplay-bold':       'PlayfairDisplay-Bold',
      'PlayfairDisplay-bolditalic': 'PlayfairDisplay-BoldItalic',
      'DMSans-normal':  'DMSans-Regular',
      'DMSans-light':   'DMSans-Light',
      'DMSans-medium':  'DMSans-Medium',
    };
    const fontKey = keyMap[name + '-' + style];
    if (window.WSA_FONTS && fontKey && WSA_FONTS.has(fontKey)) {
      pdf.setFont(name, style);
    } else {
      const fb = {
        CormorantGaramond: { normal: ['Times','normal'], italic: ['Times','italic'], light: ['Times','normal'], semibold: ['Times','bold'] },
        PlayfairDisplay:   { bold: ['Times','bold'], bolditalic: ['Times','bolditalic'] },
        DMSans:            { normal: ['Helvetica','normal'], light: ['Helvetica','normal'], medium: ['Helvetica','bold'] },
      };
      const r = ((fb[name] || {})[style]) || ['Helvetica','normal'];
      pdf.setFont(r[0], r[1]);
    }
  }

  const PTmm = 0.3528;
  const fs   = fontScale;

  // Hintergrund (inkl. Bleed)
  sf(bg); pdf.rect(0, 0, docW, docH, 'F');

  // Außenrahmen — läuft in den Beschnitt hinein
  const BW = th.hasBorder ? 3.703 * fS : 0;
  if (th.hasBorder) {
    sf(tc);
    pdf.rect(0,             0,               docW,  by+BW, 'F');
    pdf.rect(0,             by + baseH - BW, docW,  BW+by, 'F');
    pdf.rect(0,             0,               bx+BW, docH,  'F');
    pdf.rect(bx + baseW - BW, 0,             BW+bx, docH,  'F');
  }

  // Innenrahmen
  const fi = 7 * fS;
  const frameOp = th.hasBorder ? 0.38 : 0.22;
  sd(bl(tc, frameOp)); pdf.setLineWidth(0.25 * fS);
  pdf.rect(bx + fi, by + fi, baseW - fi * 2, baseH - fi * 2, 'S');

  // Layout
  const PL = BW + 14 * fS, PT = BW + 13 * fS, PB = BW + 10 * fS;
  const cxPage = bx + baseW / 2;
  const contX  = bx + PL, contY = by + PT;
  const contW  = baseW - PL * 2, contH = baseH - PT - PB;

  // Header
  let y = contY;

  // Titel — CormorantGaramond light (Old Money)
  const titleFS  = 26 * fS;
  const titleTxt = document.getElementById('inp-title').value.trim() || I18N[currentLang].pdfTitleFb;
  st(tc); setFont('CormorantGaramond', 'light'); pdf.setFontSize(titleFS * fs);
  y += titleFS * fs * PTmm * 0.5;
  pdf.text(titleTxt, cxPage, y, { align: 'center', baseline: 'middle' });
  y += titleFS * fs * PTmm * 0.5 + 2 * fS;

  // Untertitel
  const subTxt = document.getElementById('inp-subtitle').value.trim();
  if (subTxt) {
    const subFS = 10.5 * fS * fs;
    st(bl(tc, 0.62)); setFont('CormorantGaramond', 'italic'); pdf.setFontSize(subFS);
    y += 2 * fS + subFS * PTmm * 0.5;
    pdf.text(subTxt, cxPage, y, { align: 'center', baseline: 'middle' });
    y += subFS * PTmm * 0.5 + 2 * fS;
  }

  // Trennlinie
  y += 4 * fS;
  sd(bl(tc, 0.38)); pdf.setLineWidth(0.25 * fS);
  pdf.line(cxPage - 17 * fS, y, cxPage + 17 * fS, y);
  y += 7 * fS;

  const contentTopY = y;
  const footerH     = 8 * fS;
  const gridAvailH  = contY + contH - footerH - contentTopY;

  // Grid-Konfiguration
  const cols   = tableCount <= 2 ? 1 : tableCount <= 6 ? 2 : 3;
  const isSpac = tableCount <= 4;
  const isComp = tableCount >= 9;
  const colGap = 8 * fS, rowGap = 9 * fS;
  const cardW  = (contW - colGap * (cols - 1)) / cols;

  // Font-Größen
  const FS_NUM   = 6.5  * fS * fs;
  const FS_NAME  = 11   * fS * fs;
  const FS_GUEST = 8.5  * fS * fs;

  // Ornament-Zeichner ORN_SMALL
  function drawOrnSmall(cx_o, topY, w) {
    const s  = w / 90;
    const my = topY + 6 * s;
    sd(bl(tc, 0.80)); pdf.setLineWidth(Math.max(0.72 * s, 0.08));
    pdf.line(cx_o - w / 2 + 6  * s, my, cx_o - w / 2 + 37 * s, my);
    pdf.line(cx_o - w / 2 + 53 * s, my, cx_o - w / 2 + 84 * s, my);
    sf(bl(tc, 0.82));
    pdf.lines([[3 * s, 3 * s], [-3 * s, 3 * s], [-3 * s, -3 * s]], cx_o - w / 2 + 45 * s, topY + 3 * s, [1, 1], 'F', true);
    sf(bl(tc, 0.58));
    pdf.circle(cx_o - w / 2 + 6  * s, my, Math.max(1.4 * s, 0.1), 'F');
    pdf.circle(cx_o - w / 2 + 84 * s, my, Math.max(1.4 * s, 0.1), 'F');
  }

  // Ornament-Zeichner ORN_LARGE
  function drawOrnLarge(cx_o, topY, w) {
    const s  = w / 180;
    const my = topY + 13 * s;

    // Obere Kurve Q→C
    sd(bl(tc, 0.70)); pdf.setLineWidth(Math.max(0.85 * s, 0.08));
    pdf.lines([[45.33 * s, -6 * s, 90.67 * s, -6 * s, 136 * s, 0]], cx_o - w / 2 + 22 * s, my, [1, 1], 'S');
    // Untere Kurve Q→C
    pdf.lines([[45.33 * s, 6 * s, 90.67 * s, 6 * s, 136 * s, 0]], cx_o - w / 2 + 22 * s, my, [1, 1], 'S');

    // Linkes Scroll-Ornament
    pdf.setLineWidth(Math.max(0.82 * s, 0.08));
    pdf.lines([
      [-7 * s,  0 * s, -12 * s, -4 * s, -10 * s, -8 * s],
      [ 2 * s, -3 * s,   6 * s,  0 * s,   4 * s,  4 * s],
      [-1 * s,  2 * s,  -4 * s,  1 * s,  -3 * s, -1 * s],
    ], cx_o - w / 2 + 22 * s, my, [1, 1], 'S');

    // Rechtes Scroll-Ornament
    pdf.lines([
      [ 7 * s,  0 * s,  12 * s, -4 * s,  10 * s, -8 * s],
      [-2 * s, -3 * s,  -6 * s,  0 * s,  -4 * s,  4 * s],
      [ 1 * s,  2 * s,   4 * s,  1 * s,   3 * s, -1 * s],
    ], cx_o - w / 2 + 158 * s, my, [1, 1], 'S');

    // Zentral-Diamant M90,8 L94,13 L90,18 L86,13
    sf(bl(tc, 0.88));
    const gs = 4 * s;
    pdf.lines([[gs, gs], [-gs, gs], [-gs, -gs]], cx_o - gs, topY + 8 * s, [1, 1], 'F', true);

    // Kreise
    sf(bl(tc, 0.62));
    pdf.circle(cx_o - w / 2 + 22  * s, my, Math.max(1.8 * s, 0.12), 'F');
    pdf.circle(cx_o - w / 2 + 158 * s, my, Math.max(1.8 * s, 0.12), 'F');
  }

  // Kartenhöhe berechnen
  function cardHeight(t) {
    const guests  = parseGuests(t.guests_raw);
    const hasName = t.name && t.name.trim();
    const topOrnW = isSpac ? cardW * 0.9 : cardW * 0.8;
    const topOrnH = isSpac ? 26 * (topOrnW / 180) : 12 * (topOrnW / 90);
    const botOrnW = cardW * 0.8;
    const botOrnH = isComp ? 0 : 12 * (botOrnW / 90);
    const numH    = FS_NUM  * PTmm + 1.5 * fS;
    const nameH   = hasName ? FS_NAME * PTmm + 2.5 * fS : 0;
    const ruleH   = 3 * fS;
    const guestH  = guests.length * (FS_GUEST * PTmm + 2.4 * fS);
    return topOrnH + numH + nameH + ruleH + guestH + botOrnH + 2 * fS;
  }

  // Auto-Scale
  const rows       = Math.ceil(tableCount / cols);
  const maxRowCards = Array.from({ length: rows }, (_, r) =>
    Array.from({ length: cols }, (_, c) => tableData[r * cols + c]).filter(Boolean)
  );
  const rowHeights = maxRowCards.map(row => Math.max(...row.map(cardHeight)));
  const totalGridH = rowHeights.reduce((s, h) => s + h, 0) + rowGap * (rows - 1);
  const cS         = totalGridH > gridAvailH ? gridAvailH / totalGridH : 1.0;

  // Karten zeichnen
  for (let i = 0; i < tableCount; i++) {
    const t      = tableData[i];
    const col    = i % cols;
    const row    = Math.floor(i / cols);
    const cardX  = contX + col * (cardW + colGap);
    const cardCx = cardX + cardW / 2;

    const prevRowsH = rowHeights.slice(0, row).reduce((s, h) => s + h, 0) + row * rowGap;
    let cy = contentTopY + prevRowsH * cS;

    const guests  = parseGuests(t.guests_raw);
    const hasName = t.name && t.name.trim();

    // Ornament oben
    const topOrnW = (isSpac ? cardW * 0.9 : cardW * 0.8) * cS;
    if (isSpac) {
      drawOrnLarge(cardCx, cy, topOrnW);
      cy += 26 * (topOrnW / 180);
    } else {
      drawOrnSmall(cardCx, cy, topOrnW);
      cy += 12 * (topOrnW / 90);
    }

    // Tischnummer
    st(bl(tc, 0.55)); setFont('DMSans', 'normal'); pdf.setFontSize(FS_NUM * cS);
    cy += FS_NUM * cS * PTmm * 0.5;
    pdf.text(I18N[currentLang].pdfTableLabel(i), cardCx, cy, { align: 'center', baseline: 'middle' });
    cy += FS_NUM * cS * PTmm * 0.5 + 1.5 * fS * cS;

    // Tischname
    if (hasName) {
      st(tc); setFont('CormorantGaramond', 'normal'); pdf.setFontSize(FS_NAME * cS);
      cy += FS_NAME * cS * PTmm * 0.5;
      pdf.text(t.name.trim(), cardCx, cy, { align: 'center', baseline: 'middle' });
      cy += FS_NAME * cS * PTmm * 0.5 + 2.5 * fS * cS;
    }

    // Trennlinie mit Diamant
    const drW  = cardW * 0.55;
    const drGap = 2.5 * fS * cS;
    const dY   = cy + 1.5 * fS * cS;
    sd(bl(tc, 0.22)); pdf.setLineWidth(0.25 * fS);
    pdf.line(cardCx - drW / 2, dY, cardCx - drGap, dY);
    pdf.line(cardCx + drGap,   dY, cardCx + drW / 2, dY);
    const gs = 1.5 * fS * cS;
    sf(bl(tc, 0.52));
    pdf.lines([[gs, -gs], [gs, gs], [-gs, gs]], cardCx - gs, dY, [1, 1], 'F', true);
    cy += 3 * fS * cS;

    // Gäste
    st(tc); setFont('CormorantGaramond', 'normal'); pdf.setFontSize(FS_GUEST * cS);
    guests.forEach(g => {
      cy += FS_GUEST * cS * PTmm * 0.5 + 0.5 * fS * cS;
      pdf.text(g, cardCx, cy, { align: 'center', baseline: 'middle' });
      cy += FS_GUEST * cS * PTmm * 0.5 + 0.5 * fS * cS + 1.4 * fS * cS;
    });

    // Ornament unten
    if (!isComp) {
      const botOrnW = cardW * 0.8 * cS;
      drawOrnSmall(cardCx, cy, botOrnW);
    }
  }

  // Footer
  const fY     = by + baseH - PB + 3 * fS;
  const fLineW = 22 * fS;
  const fGap   = 3.5 * fS;
  sd(bl(tc, 0.28)); pdf.setLineWidth(0.25 * fS);
  pdf.line(cxPage - fGap - fLineW, fY, cxPage - fGap, fY);
  pdf.line(cxPage + fGap,          fY, cxPage + fGap + fLineW, fY);
  sf(bl(tc, 0.45)); pdf.circle(cxPage, fY, 0.75 * fS, 'F');

  // Speichern
  const saveName = (document.getElementById('inp-title').value.trim() || 'Tischplan').replace(/\s+/g, '_');
  pdf.save('Tischplan_OldMoney_' + saveName + '_' + formatKey.toUpperCase() + '.pdf');
}
